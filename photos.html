<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' localthumb:; img-src 'self' localthumb: data: localthumb:;">
<title>WinPhotos</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI Variable','Segoe UI',Ubuntu,'Noto Sans',system-ui,sans-serif;font-size:13px;color:#e0e0e0;background:#111;overflow:hidden;height:100vh;user-select:none}
button{border:none;cursor:pointer;background:transparent;color:#e0e0e0;font-family:inherit}
#app{display:flex;flex-direction:column;height:100vh}
.titlebar{height:32px;background:#1a1a1a;display:flex;align-items:center;justify-content:space-between;padding:0 0 0 12px;border-bottom:1px solid #333;-webkit-app-region:drag;flex-shrink:0}
.tl{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500}
.wb{display:flex;-webkit-app-region:no-drag}.wb button{width:46px;height:32px;font-size:11px;display:flex;align-items:center;justify-content:center;transition:background .08s}.wb button:hover{background:rgba(255,255,255,.1)}.wb .cl:hover{background:#e81123;color:#fff}
.bar{height:42px;background:#1a1a1a;display:flex;align-items:center;padding:0 16px;gap:8px;border-bottom:1px solid #333;flex-shrink:0}
.btn{height:30px;padding:0 14px;border-radius:6px;font-size:13px;font-weight:500;transition:all .1s}.btn:hover{background:rgba(255,255,255,.1)}.btn.a{background:#60cdff;color:#000}
.bar .sp{flex:1}
.fbtn{height:30px;padding:0 12px;border-radius:6px;font-size:12px;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.06);transition:background .1s}.fbtn:hover{background:rgba(255,255,255,.12)}
/* Gallery */
.gallery{flex:1;overflow-y:auto;padding:16px;background:#111}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px}
.git{aspect-ratio:1;border-radius:6px;overflow:hidden;cursor:pointer;position:relative;background:#222;transition:transform .1s}
.git:hover{transform:scale(1.02);box-shadow:0 4px 16px rgba(0,0,0,.4)}
.git img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .15s}.git img.ld{opacity:1}
.git .gn{position:absolute;bottom:0;left:0;right:0;padding:6px 8px;background:linear-gradient(transparent,rgba(0,0,0,.75));font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gdate{grid-column:1/-1;font-size:14px;font-weight:600;padding:12px 0 4px}
.gload{text-align:center;padding:60px;color:#999}
/* Viewer */
.viewer{flex:1;display:none;flex-direction:column;background:#000;position:relative}
.viewer.on{display:flex}
.vmain{flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
/* Blurred instant backdrop (shows the cached thumb the moment you navigate, while full-res decodes) */
.vbg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(28px) brightness(.45);opacity:.55;z-index:0;transition:opacity .2s;pointer-events:none}
/* Raster images render to a <canvas> via createImageBitmap()+close() so Chromium never accumulates
   decoded images in its WebKit/Skia cache (that was the scrub-OOM). The canvas fills the viewport;
   fit/fill/zoom are computed at draw time. A single <img> is kept ONLY for animated GIFs. */
.vmain canvas{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.vmain canvas.hid{display:none}
/* GIF fallback (animation): centered, contained, never upscaled past natural size (like Win Photos) */
.vmain img{position:absolute;max-width:100%;max-height:100%;object-fit:contain;z-index:1}.vmain img.hid{display:none}
.vmain img.fill{width:100%;height:100%;max-width:none;max-height:none;object-fit:cover}
.arr{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.08);font-size:22px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px);z-index:5;transition:opacity .2s,background .1s}.arr:hover{background:rgba(255,255,255,.25)}.arr.l{left:20px}.arr.r{right:20px}
/* IMMERSIVE: hide all chrome, show only the image (toggled by double-click / button / idle) */
.viewer.chrome-hidden{cursor:none}
.viewer.chrome-hidden .vtop,.viewer.chrome-hidden .film,.viewer.chrome-hidden .arr{opacity:0;pointer-events:none}
.vtop,.film{transition:opacity .2s}
.viewer.film-off .film{display:none}
/* OS FULLSCREEN (F11 / ⛶ button): hide the window's own chrome so only the content shows */
body.fs .titlebar, body.fs .bar, body.fs .statusbar{display:none}
.vtop{position:absolute;top:0;left:0;right:0;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:linear-gradient(rgba(0,0,0,.6),transparent);z-index:3}
.vinfo{font-size:13px;display:flex;align-items:center;gap:10px}.vinfo .fn{font-weight:600}.vinfo .fc{opacity:.5;font-size:12px}
.vb{width:36px;height:36px;border-radius:6px;font-size:14px;display:flex;align-items:center;justify-content:center;transition:background .1s}.vb:hover{background:rgba(255,255,255,.12)}.vb.act{background:rgba(96,205,255,.2);color:#60cdff}
.zl{font-size:12px;opacity:.5;min-width:44px;text-align:center}
.vsep{width:1px;height:22px;background:rgba(255,255,255,.12);margin:0 4px}
/* Filmstrip floats over the bottom of the image (Windows Photos) — it never reserves layout space,
   so the image occupies the entire viewport. Auto-hides with the rest of the chrome. */
.film{position:absolute;left:0;right:0;bottom:0;height:80px;display:flex;align-items:center;gap:5px;padding:0 16px;overflow-x:auto;background:linear-gradient(transparent,rgba(10,10,10,.92) 40%);border-top:1px solid rgba(255,255,255,.04);z-index:3}
.ft{width:56px;height:56px;border-radius:5px;overflow:hidden;cursor:pointer;border:2px solid transparent;opacity:.5;transition:all .1s;flex-shrink:0}.ft.a{border-color:#60cdff;opacity:1}.ft:hover{opacity:.8}.ft img{width:100%;height:100%;object-fit:cover}
.ipanel{position:absolute;top:44px;right:0;bottom:0;width:280px;background:rgba(30,30,30,.97);border-left:1px solid rgba(255,255,255,.08);padding:20px;overflow-y:auto;z-index:4;animation:si .15s ease}
@keyframes si{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.ipanel h3{margin-bottom:16px;font-size:14px;font-weight:600}
.ir{margin-bottom:12px}.ir .il{font-size:10px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}.ir .iv{font-size:13px;word-break:break-all}
/* Drop zone */
.dropzone{position:fixed;inset:0;z-index:9999;background:rgba(96,205,255,.08);border:3px dashed #60cdff;display:none;align-items:center;justify-content:center;font-size:16px;color:#60cdff;pointer-events:none}
.dropzone.show{display:flex}
.statusbar{height:26px;background:#1a1a1a;border-top:1px solid #333;display:flex;align-items:center;padding:0 16px;gap:16px;font-size:12px;color:#999;flex-shrink:0}
</style>
</head>
<body>
<div id="app">
  <div class="titlebar"><div class="tl"><span>🖼️</span><span id="ttl">WinPhotos</span></div><div class="wb"><button onclick="api.winMin()">─</button><button onclick="api.winMax()">□</button><button class="cl" onclick="api.winClose()">✕</button></div></div>
  <div class="bar" id="bar"></div>
  <div class="gallery" id="gallery"></div>
  <div class="viewer" id="viewer"></div>
  <div class="dropzone" id="dropzone">Drop image here to add to folder</div>
  <div class="statusbar" id="status"></div>
</div>
<script>
let mode='gallery', images=[], vi=0, zoom=1, infoOn=false, curFolder='';
let vcanvas=null, vctx=null, gifImg=null, liveBM=null, preloaded={}, thumbUrls={};
let galCycle=0;
// Pan offset (in canvas backing-store pixels, relative to the centered position). Cursor-anchored
// zoom and drag-to-pan write here; drawBM() clamps it so the image always covers the viewport.
let panX=0, panY=0, panning=false, panStart=null;
const params=new URLSearchParams(location.search);

async function init(){
  curFolder = params.get('folder') || '';
  const targetImage = params.get('image') || '';

  if(!curFolder) {
    curFolder = await api.pickFolder();
    if(!curFolder){ document.getElementById('gallery').innerHTML='<div class="gload">No folder selected</div>'; return; }
  }

  renderBar();

  // Request sorted image list from main process. If Explorer pre-staged one for this exact
  // window, that's returned as-is; otherwise main falls back to scanning curFolder itself
  // (e.g. a window opened via the OS/dashboard --photos launch, with no injected list).
  const sortedData = await api.getSortedList(curFolder);

  if(sortedData && sortedData.sortedPaths && sortedData.sortedPaths.length) {
    // Explorer (or main's folder-scan fallback) provided a sorted list — use it directly
    images = sortedData.sortedPaths.map(p => {
      const name = p.split('/').pop();
      const ext = name.split('.').pop().toLowerCase();
      return { name, path: p, ext, size: 0, modified: '', modifiedDate: '' };
    });
    // Find the exact clicked image
    const startImg = sortedData.startImage || targetImage;
    const idx = startImg ? images.findIndex(img => img.path === startImg) : 0;
    await showViewer(idx >= 0 ? idx : 0);
    updTitle();
    // Load stats in background
    for (let i = 0; i < images.length; i++) {
      const r = await api.stat(images[i].path);
      if (r.ok) { images[i].size = r.stats.size; images[i].modified = r.stats.modified; images[i].modifiedDate = r.stats.modified?.split('T')[0] || ''; }
    }
    return;
  }

  // Fallback: standalone mode — load images ourselves
  images = await api.listImages(curFolder);

  if(targetImage && images.length) {
    const idx = images.findIndex(img => img.path === targetImage);
    if(idx >= 0) { await showViewer(idx); return; }
  }

  if(images.length) renderGallery();
  else document.getElementById('gallery').innerHTML='<div class="gload">📂 No images here. Click "Scan Subfolders" to search deeper.</div>';
  updStat(); updTitle();
}

function renderBar(){
  document.getElementById('bar').innerHTML=`
    <button class="btn ${mode==='gallery'?'a':''}" onclick="toGallery()">🖼️ Gallery</button>
    <button class="btn ${mode==='viewer'?'a':''}" onclick="if(images.length)showViewer(vi)">👁️ Viewer</button>
    <div class="sp"></div>
    <button class="fbtn" onclick="deepScan()">🔍 Scan Subfolders</button>
    <button class="fbtn" onclick="changeFolder()">📁 ${curFolder.split('/').pop()||'/'}</button>
    <button class="fbtn" onclick="doRefresh()">🔄</button>`;
}

// ═══ GALLERY ═══
function renderGallery(){
  const el=document.getElementById('gallery');
  if(!images.length){ el.innerHTML='<div class="gload">📂 No images</div>'; return; }
  galCycle++;
  const groups={};
  for(const img of images){ const d=img.modifiedDate; if(!groups[d])groups[d]=[]; groups[d].push(img); }

  let h='<div class="gg">';
  for(const[date,imgs] of Object.entries(groups)){
    h+=`<div class="gdate">${fmtDate(date)}</div>`;
    for(const img of imgs){
      const globalIdx = images.indexOf(img);
      h+=`<div class="git" ondblclick="showViewer(${globalIdx})" draggable="true" ondragstart="startNativeDrag(event,'${esc(img.path)}')"><img data-gpath="${img.path}" data-greqid="" decoding="async" src=""><div class="gn">${img.name}</div></div>`;
    }
  }
  h+='</div>';
  el.innerHTML=h;
  loadGalThumbs();
}

let galReqId=0;
async function loadGalThumbs(){
  const cycle=galCycle;
  const imgEls = [...document.querySelectorAll('.git img[data-gpath]')];
  // Build direct reference map
  const elMap=new Map();
  for(const el of imgEls){elMap.set(el.getAttribute('data-gpath'),el)}

  // Apply cached first
  const uncached=[];
  for(const[p,el]of elMap){
    if(thumbUrls[p]){el.src=thumbUrls[p];el.classList.add('ld');}
    else uncached.push({p,el});
  }

  // Load uncached with request-ID protection
  for(const item of uncached){
    if(galCycle!==cycle)return;
    const rid=++galReqId;
    item.el.dataset.greqid=String(rid);
    const url=await api.getThumb(item.p);
    if(galCycle!==cycle)return;
    // Verify this element still expects this request
    if(item.el.dataset.greqid!==String(rid))continue;
    if(item.el.dataset.gpath!==item.p)continue;
    if(url){thumbUrls[item.p]=url;item.el.src=url;item.el.classList.add('ld')}
  }
}

async function deepScan(){
  document.getElementById('gallery').innerHTML='<div class="gload">🔍 Scanning subfolders...</div>';
  images = await api.scanImages(curFolder, 4);
  images.sort((a,b) => b.modified.localeCompare(a.modified));
  renderGallery(); updStat();
}

// ═══ VIEWER ═══
async function showViewer(idx){
  mode='viewer'; vi=idx; zoom=1; panX=0; panY=0; infoOn=false; chromeHidden=false;
  document.getElementById('gallery').style.display='none';
  document.getElementById('viewer').className='viewer on';
  renderBar(); buildDOM(); await showCur(); preloadNear();
  showChrome(); // visible briefly, then auto-hides while idle
}

// ═══ IMMERSIVE CHROME — auto-hide on idle, double-click / button toggles (like Windows Photos) ═══
let chromeHidden=false, idleTmr=null;
function applyChrome(){ const v=document.getElementById('viewer'); if(v) v.classList.toggle('chrome-hidden', chromeHidden && mode==='viewer'); }
function showChrome(){ chromeHidden=false; applyChrome(); clearTimeout(idleTmr); idleTmr=setTimeout(()=>{ if(mode==='viewer'){ chromeHidden=true; applyChrome(); } }, 2600); }
function hideChrome(){ chromeHidden=true; applyChrome(); clearTimeout(idleTmr); }
function toggleChrome(){ if(mode!=='viewer') return; chromeHidden ? showChrome() : hideChrome(); }
function toggleFilm(){ const v=document.getElementById('viewer'); if(v) v.classList.toggle('film-off'); }
// Any mouse movement in the viewer reveals the chrome and restarts the idle timer.
document.addEventListener('mousemove', ()=>{ if(mode==='viewer' && chromeHidden) showChrome(); });

// ═══ TRUE OS FULLSCREEN (F11-style) — window covers the screen, app titlebar + panels hidden ═══
let isFS=false;
function toggleFullScreen(){ if(window.api&&api.winToggleFullScreen) api.winToggleFullScreen(); }
function exitFullScreen(){ if(window.api&&api.winSetFullScreen) api.winSetFullScreen(false); }
if(window.api&&window.api.onFullScreen) window.api.onFullScreen(on=>{
  isFS=on; document.body.classList.toggle('fs',on);
  const b=document.getElementById('immBtn'); if(b) b.classList.toggle('act',on);
  if(mode==='viewer'){
    if(on) hideChrome();   // entering fullscreen → hide the top/bottom bars (incl. Fit/Fill/100%); mouse-move reveals them
    else showChrome();     // leaving fullscreen → bring the controls back
    // The viewport size changes on FS toggle — re-fit the canvas a couple of frames later.
    setTimeout(()=>{ if(mode==='viewer'){ fitCanvas(); drawBM(); } }, 60);
    setTimeout(()=>{ if(mode==='viewer'){ fitCanvas(); drawBM(); } }, 250);
  }
});

// Delete the current image (to Trash — recoverable) and advance, like Windows Photos.
async function deleteCurrent(){
  const img=images[vi]; if(!img) return;
  const r=await api.trash(img.path);
  if(r&&r.ok){
    images.splice(vi,1); delete preloaded[img.path];
    if(!images.length){ toGallery(); return; }
    if(vi>=images.length) vi=images.length-1;
    display(vi);
  }
}

function buildDOM(){
  const v=document.getElementById('viewer');
  v.innerHTML=`
    <div class="vtop">
      <div class="vinfo"><span>🖼️</span><span class="fn" id="vfn"></span><span class="fc" id="vfc"></span></div>
      <div style="display:flex;gap:4px;align-items:center">
        <button class="vb" title="Zoom out (−)" onclick="zOut()">−</button>
        <span class="zl" id="zl">100%</span>
        <button class="vb" title="Zoom in (+)" onclick="zIn()">+</button>
        <div class="vsep"></div>
        <button class="vb" id="infoBtn" onclick="infoOn=!infoOn;updUI()">ℹ️</button>
        <button class="vb" id="filmBtn" title="Toggle filmstrip (F)" onclick="toggleFilm()">▦</button>
        <button class="vb" id="fitBtn" title="Fit / Fill (use the whole screen)" onclick="toggleFitFill()">⊡</button>
        <button class="vb" id="immBtn" title="Fullscreen (F11 / double-click image)" onclick="toggleFullScreen()">⛶</button>
        <button class="vb" title="Back to gallery (Esc)" onclick="toGallery()">✕</button>
      </div>
    </div>
    <div class="vmain" id="vmain" ondblclick="toggleFullScreen()">
      <div class="vbg" id="vbg"></div>
      ${images.length>1?'<button class="arr l" title="Previous (←)" onclick="event.stopPropagation();goPrev()">‹</button>':''}
      ${images.length>1?'<button class="arr r" id="arrR" title="Next (→)" onclick="event.stopPropagation();goNext()">›</button>':''}
      <canvas id="vcanvas" draggable="true"></canvas>
      <img id="gifImg" class="hid" draggable="true">
    </div>
    <div id="ipc"></div>
    ${images.length>1?'<div class="film" id="film"></div>':''}`;
  vcanvas=document.getElementById('vcanvas');
  // willReadFrequently → Chromium uses a CPU-backed canvas, so each image is NOT uploaded as a GPU
  // texture. On integrated GPUs (Mint) the GPU process was climbing to ~520MB and crashing the whole
  // app even with gigabytes of free RAM; CPU compositing keeps the GPU process idle and stable.
  vctx=vcanvas.getContext('2d',{ willReadFrequently:true, alpha:false });
  gifImg=document.getElementById('gifImg');
  liveBM=null;
  // Native drag from the viewer (only fires when the image isn't zoomed-in — drawBM() sets
  // canvas.draggable=false while pannable so the pointer handlers below take over instead).
  vcanvas.addEventListener('dragstart', e => { e.preventDefault(); api.nativeDrag(images[vi].path); });
  gifImg.addEventListener('dragstart', e => { e.preventDefault(); api.nativeDrag(images[vi].path); });

  // DRAG-TO-PAN — when zoomed in past the viewport, click-drag moves the image (cursor shows grab/
  // grabbing). Uses pointer capture so the drag survives the cursor leaving the canvas.
  vcanvas.addEventListener('pointerdown', e => {
    if(e.button!==0 || !isPannable()) return;
    panning=true; panStart={ x:e.clientX, y:e.clientY, px:panX, py:panY };
    try{ vcanvas.setPointerCapture(e.pointerId); }catch{}
    vcanvas.style.cursor='grabbing'; e.preventDefault();
  });
  vcanvas.addEventListener('pointermove', e => {
    if(!panning) return;
    const dpr=window.devicePixelRatio||1;
    panX=panStart.px+(e.clientX-panStart.x)*dpr;
    panY=panStart.py+(e.clientY-panStart.y)*dpr;
    drawBM();
  });
  const endPan = e => { if(!panning) return; panning=false; try{ vcanvas.releasePointerCapture(e.pointerId); }catch{} vcanvas.style.cursor=isPannable()?'grab':''; };
  vcanvas.addEventListener('pointerup', endPan);
  vcanvas.addEventListener('pointercancel', endPan);
}

// ═══ FLAT-MEMORY CANVAS RENDERER ═══════════════════════════════════════════════════════════════
// Root cause of the scrub-crash: a Chromium <img> retains its DECODED pixels in the WebKit/Skia
// cache even after src changes, and webFrame.clearCache() did not reliably free it on this build →
// memory climbed → Linux OOM-killer SIGKILLed the whole app (uncatchable, no log).
// Fix: never put full images in an <img>. We fetch the display-sized JPEG BYTES, decode them with
// createImageBitmap() (off the element cache), paint the bitmap to a single reused <canvas>, then
// bitmap.close() to free the decode IMMEDIATELY. At most ONE decoded bitmap is alive at a time →
// memory is flat (a sawtooth at most), regardless of how many thousand images you scrub through.

// Size the canvas backing store to the viewport (× devicePixelRatio for crisp output).
function fitCanvas(){
  const m=document.getElementById('vmain'); if(!m||!vcanvas) return false;
  const dpr=window.devicePixelRatio||1;
  const w=Math.max(1,m.clientWidth), h=Math.max(1,m.clientHeight);
  const bw=Math.round(w*dpr), bh=Math.round(h*dpr);
  if(vcanvas.width!==bw||vcanvas.height!==bh){ vcanvas.width=bw; vcanvas.height=bh; }
  return true;
}
// Base scale = the "fit" (or "fill") scale at zoom=1, before the user's zoom multiplier.
// Fit = contain but never enlarge past natural size; Fill = cover (crops).
function baseScale(){
  if(!liveBM||!vcanvas) return 1;
  const dpr=window.devicePixelRatio||1;
  const cw=vcanvas.width, ch=vcanvas.height, iw=liveBM.width, ih=liveBM.height;
  const contain=Math.min(cw/iw, ch/ih), cover=Math.max(cw/iw, ch/ih);
  return fillMode ? cover : Math.min(contain, dpr);
}
// Clamp pan so you can't drag the image past its edges — when the image is larger than the viewport
// in an axis you can pan within ±(overflow/2); when it fits, that axis stays centered. Matches the
// "the viewport always stays covered" feel of Windows Photos.
function clampPan(scale){
  const cw=vcanvas.width, ch=vcanvas.height, iw=liveBM.width, ih=liveBM.height;
  const ox=(iw*scale-cw), oy=(ih*scale-ch);
  panX = ox<=0 ? 0 : Math.max(-ox/2, Math.min(ox/2, panX));
  panY = oy<=0 ? 0 : Math.max(-oy/2, Math.min(oy/2, panY));
}
// True when the image overflows the viewport at the current zoom (so dragging it makes sense).
function isPannable(){
  if(!liveBM||!vcanvas||(gifImg&&!gifImg.classList.contains('hid'))) return false;
  const s=baseScale()*zoom;
  return liveBM.width*s>vcanvas.width+1 || liveBM.height*s>vcanvas.height+1;
}
// Draw the currently-live bitmap with the active fit/fill + zoom + pan, then reflect pannability on
// the cursor and toggle native-drag (only drag the file out when the image isn't pannable).
function drawBM(){
  if(!liveBM||!vctx||!vcanvas) return;
  const cw=vcanvas.width, ch=vcanvas.height;
  const iw=liveBM.width, ih=liveBM.height;
  const scale=baseScale()*zoom;
  clampPan(scale);
  const dw=iw*scale, dh=ih*scale;
  const dx=(cw-dw)/2+panX, dy=(ch-dh)/2+panY;
  vctx.clearRect(0,0,cw,ch);
  vctx.imageSmoothingEnabled=true; vctx.imageSmoothingQuality='high';
  vctx.drawImage(liveBM, dx, dy, dw, dh);
  const pan=isPannable();
  vcanvas.draggable=!pan; // native drag-out only when not zoomed in
  if(!panning) vcanvas.style.cursor=pan?'grab':'';
}
// Cursor-anchored zoom: keep the image point under (cx,cy) — in canvas backing pixels — fixed as the
// zoom changes. cx/cy default to the viewport centre (used by the +/− buttons and keyboard).
function zoomAt(nz, cx, cy){
  nz=Math.max(0.25, Math.min(8, nz));
  if(!liveBM||!vcanvas){ // GIF path (no canvas bitmap): plain scale, no anchor/pan
    zoom=nz; if(gifImg && !gifImg.classList.contains('hid')) gifImg.style.transform=`scale(${zoom})`;
    updZl(); return;
  }
  const cw=vcanvas.width, ch=vcanvas.height, iw=liveBM.width, ih=liveBM.height;
  if(cx==null) cx=cw/2; if(cy==null) cy=ch/2;
  const bs=baseScale(), s0=bs*zoom, s1=bs*nz;
  const dx0=(cw-iw*s0)/2+panX, dy0=(ch-ih*s0)/2+panY;
  const ipx=(cx-dx0)/s0, ipy=(cy-dy0)/s0;       // image-space point under the cursor
  panX=(cx-ipx*s1)-(cw-iw*s1)/2;                 // solve for the pan that keeps it under the cursor
  panY=(cy-ipy*s1)-(ch-ih*s1)/2;
  zoom=nz; drawBM(); updZl();
}
function updZl(){ const zl=document.getElementById('zl'); if(zl) zl.textContent=Math.round(zoom*100)+'%'; }
// Convert a mouse event to canvas backing-store coordinates (CSS px × devicePixelRatio).
function evToCanvas(e){
  const r=vcanvas.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  return { x:(e.clientX-r.left)*dpr, y:(e.clientY-r.top)*dpr };
}

// SERIALIZED navigation — only ONE decode is ever in flight. Holding the arrow advances the index
// instantly (counter updates immediately) but intermediate images are SKIPPED, never decoded.
let displayBusy=false, displayTarget=null;
async function display(idx){
  if(!images.length)return;
  vi=((idx%images.length)+images.length)%images.length;
  zoom=1; panX=0; panY=0; // each image opens at fit, re-centred (matches Windows Photos)
  updUI(); // instant counter/name feedback, even while a previous decode is still running
  if(displayBusy){ displayTarget=vi; return; } // a decode is in flight — keep only the latest target
  displayBusy=true;
  try{
    while(true){
      const cur=vi; displayTarget=null;
      const img=images[cur]; if(!img) break;
      const vbg=document.getElementById('vbg'); if(vbg){ const th=thumbUrls[img.path]; vbg.style.backgroundImage=th?`url("${th.replace(/"/g,'%22')}")`:'none'; }
      const isGif=(img.ext||'').toLowerCase()==='gif';
      if(isGif){
        // Animated GIF: createImageBitmap would freeze it on frame 1, so use the single reusable <img>.
        let url=preloaded[img.path]; if(!url){ url=await api.displayImage(img.path); preloaded[img.path]=url; }
        if(displayTarget!=null && displayTarget!==cur){ vi=displayTarget; continue; }
        if(liveBM){ liveBM.close(); liveBM=null; }
        gifImg.style.transform='scale(1)'; gifImg.src=url; gifImg.classList.toggle('fill',fillMode); gifImg.classList.remove('hid'); vcanvas.classList.add('hid');
      } else {
        // Raster: bytes → ImageBitmap → canvas → close(). No <img> cache, no accumulation.
        let bm=null;
        try{
          const r=await api.imageBytes(img.path);
          if(r && r.ok && r.buf){ bm=await createImageBitmap(new Blob([r.buf])); }
        }catch(e){ try{ logClientErr('decode', img.path, e); }catch{} }
        // If the user advanced again while decoding, drop this frame, free it, and load the newest.
        if(displayTarget!=null && displayTarget!==cur){ if(bm) bm.close(); vi=displayTarget; continue; }
        if(bm){
          if(liveBM) liveBM.close();   // free the previous decode the instant the next is ready
          liveBM=bm;
          gifImg.classList.add('hid'); gifImg.removeAttribute('src');
          vcanvas.classList.remove('hid');
          fitCanvas(); drawBM();
        }
      }
      scheduleFilm(); // debounced — never rebuild the strip / fetch thumbs mid-scrub (see below)
      if(displayTarget==null) break;
      vi=displayTarget;
    }
  } finally{ displayBusy=false; }
  preloadNear();
}
function showCur(){ return display(vi); }
function goNext(){ return display(vi+1); }
function goPrev(){ return display(vi-1); }
function jumpTo(i){ return display(i); }

function logClientErr(kind, path, e){ if(window.api&&api.logClient) api.logClient({ kind, path, error: (e&&e.message)||String(e) }); }

// Re-fit the canvas whenever the viewport changes (window resize, fullscreen enter/exit).
window.addEventListener('resize', ()=>{ if(mode==='viewer'){ fitCanvas(); drawBM(); } });

// ═══ FIT / FILL ═══ Fit = whole image visible (contain). Fill = cover the screen, cropping.
let fillMode=false;
function applyFitFill(){
  if(gifImg) gifImg.classList.toggle('fill', fillMode);
  panX=0; panY=0; // re-centre when switching fit/fill — the base scale just changed
  drawBM(); // raster path redraws with the new scale
  const b=document.getElementById('fitBtn');
  if(b){ b.textContent=fillMode?'⊟':'⊡'; b.classList.toggle('act',fillMode); b.title=fillMode?'Fill (cropped to screen) — click for Fit':'Fit (whole image) — click for Fill'; }
}
function toggleFitFill(){ fillMode=!fillMode; applyFitFill(); }
function setFitFill(f){ fillMode=f; applyFitFill(); }

// Cache only the next/prev display URL strings (cheap, for the GIF path / backdrop). We deliberately
// do NOT prefetch/cache decoded bytes — that would re-introduce memory growth.
async function preloadNear(){
  for(const d of [1,-1]){
    const i=((vi+d)%images.length+images.length)%images.length;
    const im=images[i]; if(im && (im.ext||'').toLowerCase()==='gif' && !preloaded[im.path]) preloaded[im.path]=await api.displayImage(im.path);
  }
}

function updUI(){
  const img=images[vi]; if(!img)return;
  if(window.api&&api.reportViewer) api.reportViewer({ i: vi, total: images.length, name: img.name });
  document.getElementById('vfn').textContent=img.name;
  document.getElementById('vfc').textContent=`${vi+1} of ${images.length}`;
  document.getElementById('zl').textContent=Math.round(zoom*100)+'%';
  const ib=document.getElementById('infoBtn'); if(ib) ib.className=infoOn?'vb act':'vb';
  const ar=document.getElementById('arrR'); if(ar) ar.style.right=infoOn?'296px':'20px';
  const ipc=document.getElementById('ipc');
  if(infoOn){
    ipc.innerHTML=`<div class="ipanel"><h3>File info</h3>
      <div class="ir"><div class="il">Name</div><div class="iv">${img.name}</div></div>
      <div class="ir"><div class="il">Type</div><div class="iv">${img.ext.toUpperCase()} Image</div></div>
      <div class="ir"><div class="il">Size</div><div class="iv">${fmt(img.size)}</div></div>
      <div class="ir"><div class="il">Date</div><div class="iv">${img.modifiedDate}</div></div>
      <div class="ir"><div class="il">Path</div><div class="iv">${img.path}</div></div>
    </div>`;
  } else ipc.innerHTML='';
  updStat();
}

// DEBOUNCED filmstrip. renderFilm() fires api.getThumb() for ~30 entries, and getThumb decodes in
// the MAIN process (sharp/nativeImage). Doing that on EVERY navigation meant a fast scrub fired
// hundreds of synchronous native decodes in main → native crash of the whole app at ~200 images
// (flat memory, both windows gone — exactly the recurring "force quit"). We now only rebuild the
// strip ~220ms AFTER navigation settles, so holding the arrow never touches the thumbnail decoder.
let _filmTmr=null;
function scheduleFilm(){ clearTimeout(_filmTmr); _filmTmr=setTimeout(()=>{ if(mode==='viewer' && !displayBusy) renderFilm(); }, 220); }
function renderFilm(){
  const fs=document.getElementById('film'); if(!fs)return;
  const s=Math.max(0,vi-15), e=Math.min(images.length,vi+15);
  let h='';
  if(s>0) h+=`<div style="min-width:${s*61}px;flex-shrink:0"></div>`;
  for(let i=s;i<e;i++){
    const t=images[i], url=thumbUrls[t.path]||'';
    h+=`<div class="ft${i===vi?' a':''}" onclick="jumpTo(${i})">${url?`<img src="${url}">`:`<img data-ftpath="${t.path}" src="" style="width:100%;height:100%;object-fit:cover;background:#333">`}</div>`;
  }
  fs.innerHTML=h;
  requestAnimationFrame(()=>{ const a=fs.querySelector('.ft.a'); if(a) a.scrollIntoView({behavior:'auto',block:'nearest',inline:'center'}); });
  // Load filmstrip thumbs that aren't cached yet
  loadFilmstripThumbs();
}

async function loadFilmstripThumbs(){
  const imgs=[...document.querySelectorAll('img[data-ftpath]')];
  for(const el of imgs){
    const p=el.getAttribute('data-ftpath');
    if(thumbUrls[p]){el.src=thumbUrls[p];continue}
    const url=await api.getThumb(p);
    if(url){thumbUrls[p]=url;el.src=url}
  }
}

// Buttons / keyboard zoom around the viewport centre (multiplicative — geometric steps feel native).
function zIn(){ zoomAt(zoom*1.25); }
function zOut(){ zoomAt(zoom*0.8); }
function resetZoom(){ zoom=1; panX=0; panY=0; if(gifImg && !gifImg.classList.contains('hid')) gifImg.style.transform='scale(1)'; drawBM(); updZl(); }

function toGallery(){ mode='gallery'; chromeHidden=false; clearTimeout(idleTmr); document.getElementById('gallery').style.display=''; document.getElementById('viewer').className='viewer'; renderBar(); updStat(); }
async function changeFolder(){ const f=await api.pickFolder(); if(f){ curFolder=f; preloaded={}; thumbUrls={}; images=await api.listImages(curFolder); renderGallery(); renderBar(); updStat(); updTitle(); } }
async function doRefresh(){ preloaded={}; thumbUrls={}; images=await api.listImages(curFolder); renderGallery(); updStat(); }

// ═══ NATIVE DRAG (from gallery items) ═══
function startNativeDrag(ev, filePath){
  ev.preventDefault();
  api.nativeDrag(filePath);
}

// ═══ DROP ZONE — accept files dropped INTO Photos window ═══
document.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect='copy'; document.getElementById('dropzone').classList.add('show'); });
document.addEventListener('dragleave', e => { if(e.relatedTarget) return; document.getElementById('dropzone').classList.remove('show'); });
document.addEventListener('drop', async e => {
  e.preventDefault();
  document.getElementById('dropzone').classList.remove('show');
  // Files dropped from Explorer or desktop
  if(e.dataTransfer.files.length){
    for(const f of e.dataTransfer.files){
      const fp=(()=>{try{return api.pathForFile(f);}catch{return f&&f.path;}})();
      if(fp) await api.copyFile(fp, curFolder);
    }
    await doRefresh();
  }
});

// ═══ KEYBOARD ═══
document.addEventListener('keydown', e => {
  if(e.key==='F11'){ e.preventDefault(); toggleFullScreen(); return; }
  if(e.key==='Escape' && isFS && mode!=='viewer'){ exitFullScreen(); return; }
  if(mode==='viewer'){
    if(e.key==='ArrowRight'||e.key==='ArrowDown'){ e.preventDefault(); goNext(); }
    else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){ e.preventDefault(); goPrev(); }
    else if(e.key==='Escape'){ if(isFS) exitFullScreen(); else if(chromeHidden) showChrome(); else toGallery(); }
    else if(e.key===' '){ e.preventDefault(); goNext(); }
    else if(e.key==='+'||e.key==='='){ zIn(); }
    else if(e.key==='-'||e.key==='_'){ zOut(); }
    else if(e.key==='0'){ resetZoom(); }
    else if(e.key==='f'||e.key==='F'){ toggleFilm(); }
    else if(e.key==='i'||e.key==='I'){ infoOn=!infoOn; updUI(); }
    else if(e.key==='Delete'){ e.preventDefault(); deleteCurrent(); }
    else if(e.key==='F11'){ e.preventDefault(); toggleFullScreen(); }
  }
});
// Wheel = zoom in/out, anchored at the cursor (like Windows Photos). A precision-touchpad PINCH
// arrives as a wheel event with ctrlKey=true and small continuous deltas — we treat that as a smooth
// (exponential) zoom and preventDefault so Chromium doesn't zoom the whole page. A notched mouse
// wheel uses geometric ×1.25/÷1.25 steps. Both keep the point under the cursor fixed.
document.addEventListener('wheel', e => {
  if(mode!=='viewer') return;
  e.preventDefault();
  const c = (vcanvas && !vcanvas.classList.contains('hid')) ? evToCanvas(e) : {x:null,y:null};
  const nz = e.ctrlKey ? zoom*Math.exp(-e.deltaY*0.01)        // pinch — smooth
                       : zoom*(e.deltaY<0 ? 1.25 : 0.8);      // wheel notch — stepped
  zoomAt(nz, c.x, c.y);
}, { passive:false });

function fmt(b){if(!b)return'—';if(b<1024)return b+' B';if(b<1048576)return(b/1024).toFixed(1)+' KB';if(b<1073741824)return(b/1048576).toFixed(1)+' MB';return(b/1073741824).toFixed(1)+' GB'}
function fmtDate(d){const now=new Date().toISOString().split('T')[0];if(d===now)return'Today';const y=new Date(Date.now()-864e5).toISOString().split('T')[0];if(d===y)return'Yesterday';return new Date(d+'T00:00:00').toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}
function esc(s){return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
function updStat(){document.getElementById('status').textContent=mode==='gallery'?`${images.length} images in ${curFolder.split('/').pop()||'/'}`:`${vi+1} of ${images.length} · ${images[vi]?.name||''}`}
function updTitle(){document.getElementById('ttl').textContent='WinPhotos — '+(curFolder.split('/').pop()||'/')}

if(window.api&&window.api.onRefresh) window.api.onRefresh(()=>doRefresh());
init();
</script>
</body>
</html>
