<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' localthumb:; img-src 'self' localthumb: data: localthumb:;">
<title>WinExplorer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f3f3f3;--sf:#fff;--sb:#f9f9f9;--tb:#fbfbfb;--bd:#e5e5e5;--tx:#1a1a1a;--t2:#555;--t3:#888;--ac:#0078d4;--abg:#cde4f7;--abd:#90c0e8;--hv:#f0f4f8;--h2:#e8e8e8;--cr:#e81123;--tbg:#e8e8e8;--ctx:#fff;--cs:rgba(0,0,0,.15);--ib:#fff;--ibd:#d1d1d1}
.dark{--bg:#1e1e1e;--sf:#252526;--sb:#1e1e1e;--tb:#2d2d2d;--bd:#3e3e3e;--tx:#d4d4d4;--t2:#aaa;--t3:#777;--ac:#60cdff;--abg:#264f78;--abd:#3a7bbf;--hv:#2a2d2e;--h2:#3e3e3e;--tbg:#2d2d2d;--ctx:#2d2d2d;--cs:rgba(0,0,0,.5);--ib:#3c3c3c;--ibd:#555}
body{font-family:'Segoe UI Variable','Segoe UI',Ubuntu,'Noto Sans',system-ui,sans-serif;font-size:13px;color:var(--tx);background:var(--bg);overflow:hidden;height:100vh;user-select:none}
input,button{font-family:inherit;color:var(--tx)}button{border:none;cursor:pointer;background:transparent}
select{font-family:inherit;color:var(--tx);background:var(--ib);border:1px solid var(--ibd);border-radius:4px;height:26px;padding:0 4px;font-size:11px}
#app{display:flex;flex-direction:column;height:100vh}
.titlebar{height:32px;background:var(--tb);display:flex;align-items:center;justify-content:space-between;padding:0 0 0 12px;border-bottom:1px solid var(--bd);-webkit-app-region:drag;flex-shrink:0}
.tl{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500}
.wb{display:flex;-webkit-app-region:no-drag}.wb button{width:46px;height:32px;font-size:11px;display:flex;align-items:center;justify-content:center;transition:background .08s}.wb button:hover{background:var(--h2)}.wb .cl:hover{background:var(--cr);color:#fff}
.tabbar{height:36px;background:var(--tbg);display:flex;align-items:flex-end;padding:0 8px;gap:1px;border-bottom:1px solid var(--bd);flex-shrink:0;overflow-x:auto}
.tab{height:30px;padding:0 14px;display:flex;align-items:center;gap:8px;border-radius:8px 8px 0 0;font-size:12px;cursor:pointer;background:transparent;color:var(--t2);max-width:200px;flex-shrink:0}.tab:hover{background:var(--hv)}.tab.a{background:var(--sf);color:var(--tx);font-weight:600}
.tab.other{box-shadow:inset 0 -2px 0 var(--abd)}
.tab .tc{width:18px;height:18px;border-radius:4px;font-size:10px;display:flex;align-items:center;justify-content:center;opacity:0}.tab:hover .tc{opacity:.6}.tab .tc:hover{opacity:1;background:rgba(128,128,128,.2)}
.tn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px}
.tadd{width:30px;height:28px;border-radius:6px;font-size:16px;display:flex;align-items:center;justify-content:center;color:var(--t3);align-self:center;flex-shrink:0}.tadd:hover{background:var(--hv)}
.toolbar{height:42px;background:var(--tb);display:flex;align-items:center;padding:0 8px;gap:3px;border-bottom:1px solid var(--bd);flex-shrink:0;overflow-x:auto}
.tb{height:28px;padding:0 8px;border-radius:4px;display:flex;align-items:center;gap:4px;font-size:12px;white-space:nowrap}.tb:hover{background:var(--h2)}
.sp{width:1px;height:18px;background:var(--bd);margin:0 3px;flex-shrink:0}
.vt{display:flex;border-radius:4px;overflow:hidden;border:1px solid var(--ibd)}.vt button{width:28px;height:24px;font-size:12px;display:flex;align-items:center;justify-content:center;background:var(--ib);color:var(--t2)}.vt button.a{background:var(--ac);color:#fff}
.abar{height:38px;background:var(--tb);display:flex;align-items:center;padding:0 12px;gap:6px;border-bottom:1px solid var(--bd);flex-shrink:0}
.nb{width:28px;height:26px;border-radius:4px;font-size:14px;display:flex;align-items:center;justify-content:center}.nb:hover:not(:disabled){background:var(--h2)}.nb:disabled{color:var(--t3);cursor:default;opacity:.4}
.pb{flex:1;height:28px;background:var(--ib);border:1px solid var(--ibd);border-radius:4px;display:flex;align-items:center;padding:0 8px;gap:3px;overflow:hidden}
.ps{cursor:pointer;padding:2px 4px;border-radius:3px;color:var(--ac)}.ps:hover{background:var(--abg)}.ps.c{font-weight:600}
.psep{color:var(--t3);font-size:10px}
.sbox{width:200px;height:28px;background:var(--ib);border:1px solid var(--ibd);border-radius:4px;display:flex;align-items:center;padding:0 8px;gap:5px}.sbox input{flex:1;border:none;outline:none;font-size:12px;background:transparent;color:var(--tx)}
.body{flex:1;display:flex;overflow:hidden}
.sidebar{width:210px;background:var(--sb);border-right:1px solid var(--bd);overflow-y:auto;padding:6px 0;flex-shrink:0}
.st{padding:5px 14px;font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.6px;display:flex;align-items:center;justify-content:space-between}
.st button{font-size:14px;width:20px;height:20px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--t3)}.st button:hover{background:var(--h2);color:var(--tx)}
.si{padding:4px 14px;display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;border-radius:4px;margin:1px 6px}.si:hover{background:var(--hv)}.si.a{background:var(--abg);color:var(--ac);font-weight:600}
.si .ico{font-size:14px;width:18px;text-align:center}
.si .rm{opacity:0;font-size:11px;margin-left:auto;width:18px;height:18px;border-radius:3px;display:flex;align-items:center;justify-content:center}.si:hover .rm{opacity:.5}.si .rm:hover{opacity:1;background:var(--h2)}
/* SPLIT VIEW — panes container holds 1 or 2 panes side by side */
.panes{flex:1;display:flex;overflow:hidden}
.pane{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;border-left:2px solid transparent}
.panes.split .pane+.pane{border-left:1px solid var(--bd)}
.panes.split .pane.focused{border-left:2px solid var(--ac)}
.pane-hdr{height:22px;display:none;align-items:center;padding:0 10px;font-size:11px;color:var(--t3);background:var(--tb);border-bottom:1px solid var(--bd);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}
.panes.split .pane-hdr{display:flex}
.panes.split .pane.focused .pane-hdr{color:var(--ac);font-weight:600}
.content{flex:1;overflow-y:auto;padding:12px;background:var(--sf);position:relative}
.group-hdr{font-size:12px;font-weight:600;color:var(--t3);padding:8px 4px 4px;border-bottom:1px solid var(--bd);margin:8px 0 4px;text-transform:uppercase;letter-spacing:.3px}
/* GRID — icon sizes via CSS vars */
.gv{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--grid-cell),1fr));gap:4px}
.gi{padding:8px;border-radius:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;border:1px solid transparent;text-align:center}.gi:hover{background:var(--hv)}
.gi.sel{background:var(--abg);border-color:var(--abd)}
.gi.dov{border-color:var(--ac);background:var(--abg)}
.gi .th{width:var(--thumb-size);height:var(--thumb-size);border-radius:4px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--hv);position:relative}
.gi .th img{width:100%;height:100%;object-fit:cover}.gi .fi{font-size:var(--icon-font)}
.gi .fn{font-size:11px;line-height:15px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gi.sel .fn{font-weight:600}
.gi .vbadge{position:absolute;bottom:2px;right:2px;background:rgba(0,0,0,.7);color:#fff;font-size:9px;padding:1px 4px;border-radius:3px}
/* Icon size presets (--gi-h = approx tile height, used by content-visibility virtualization) */
.sz-sm{--grid-cell:80px;--thumb-size:48px;--icon-font:24px;--gi-h:88px}
.sz-md{--grid-cell:100px;--thumb-size:64px;--icon-font:32px;--gi-h:106px}
.sz-lg{--grid-cell:140px;--thumb-size:96px;--icon-font:48px;--gi-h:140px}
.sz-xl{--grid-cell:200px;--thumb-size:150px;--icon-font:64px;--gi-h:196px}
/* VIRTUALIZATION: skip rendering offscreen items entirely. Huge win for folders with
   thousands of files — the browser only lays out / paints what's near the viewport. */
.gi{content-visibility:auto;contain-intrinsic-size:auto var(--gi-h,110px)}
.li{content-visibility:auto;contain-intrinsic-size:auto 26px}
.ti{content-visibility:auto;contain-intrinsic-size:auto 66px}
/* LIST */
.lh{display:grid;grid-template-columns:2fr 80px 110px 100px;padding:4px 12px;font-size:12px;color:var(--t3);border-bottom:1px solid var(--bd);font-weight:600;gap:8px}
.lh span{cursor:pointer}.lh span:hover{color:var(--ac)}.lh span.sorted{color:var(--ac)}
.li{display:grid;grid-template-columns:2fr 80px 110px 100px;padding:4px 12px;border-radius:4px;cursor:pointer;gap:8px;border:1px solid transparent;font-size:12px;align-items:center}.li:hover{background:var(--hv)}.li.sel{background:var(--abg);border-color:var(--abd)}.li.dov{border-color:var(--ac)}
.li .ln{display:flex;align-items:center;gap:8px;overflow:hidden}.li .ln img{width:18px;height:18px;border-radius:2px;object-fit:cover}.li .ln .fi{font-size:14px}.li .ln span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.li .lm{color:var(--t2)}
/* TILES */
.tv{display:flex;flex-wrap:wrap;gap:8px}
.ti{width:230px;padding:10px;border-radius:6px;cursor:pointer;display:flex;gap:10px;align-items:center;border:1px solid var(--bd);background:var(--sb)}.ti:hover{background:var(--hv)}.ti.sel{background:var(--abg);border-color:var(--abd)}.ti.dov{border-color:var(--ac)}
.ti .th{width:44px;height:44px;border-radius:4px;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--hv)}.ti .th img{width:100%;height:100%;object-fit:cover}.ti .fi{font-size:26px}
.ti .tinfo{min-width:0}.ti .tname{font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ti .tmeta{font-size:11px;color:var(--t2)}.ti .tdate{font-size:10px;color:var(--t3)}
.empty{text-align:center;padding:60px;color:var(--t3)}.empty .big{font-size:48px;margin-bottom:12px}
.loading{text-align:center;padding:40px;color:var(--t3)}
.statusbar{height:26px;background:var(--tb);border-top:1px solid var(--bd);display:flex;align-items:center;padding:0 16px;gap:16px;font-size:12px;color:var(--t2);flex-shrink:0}
.ctx{position:fixed;background:var(--ctx);border:1px solid var(--bd);border-radius:8px;box-shadow:0 8px 24px var(--cs);padding:4px 0;min-width:200px;z-index:8888;animation:fi .1s}@keyframes fi{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.ci{padding:6px 16px;font-size:12px;display:flex;align-items:center;gap:10px;width:100%;text-align:left;color:var(--tx)}.ci:hover{background:var(--hv)}
.csp{height:1px;background:var(--bd);margin:4px 0}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:7777;display:flex;align-items:center;justify-content:center}
.modal{background:var(--sf);border-radius:12px;padding:24px;width:440px;box-shadow:0 16px 48px rgba(0,0,0,.25);color:var(--tx)}
.modal h3{margin-bottom:16px;font-size:16px}
.modal label{display:block;font-size:12px;color:var(--t2);margin:8px 0 4px}
.modal input[type=text],.modal input[type=password],.modal select{width:100%;height:32px;border:1px solid var(--ibd);border-radius:4px;padding:0 8px;background:var(--ib);color:var(--tx);font-size:13px}
.modal .mbtns{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.modal .mbtn{height:32px;padding:0 16px;border-radius:6px;font-size:13px;font-weight:500}.modal .mbtn.p{background:var(--ac);color:#fff}.modal .mbtn.s{background:var(--h2)}
/* OS fullscreen (F11): reclaim the titlebar's space */
body.fs .titlebar{display:none}
/* Inline rename input */
.rename-input{font:inherit;font-size:11px;border:1px solid var(--ac);border-radius:3px;padding:1px 4px;background:var(--ib);color:var(--tx);outline:none;max-width:130px}
.li .rename-input{max-width:240px}
/* Rubber band */
#rubberband{position:fixed;border:1px solid var(--ac);background:rgba(0,120,212,.08);pointer-events:none;z-index:100;display:none}
</style>
</head>
<body>
<div id="app">
  <div class="titlebar"><div class="tl"><span>📁</span><span id="ttl">File Explorer</span></div><div class="wb"><button onclick="api.winMin()">─</button><button onclick="api.winMax()">□</button><button class="cl" onclick="doClose()">✕</button></div></div>
  <div class="tabbar" id="tabbar"></div>
  <div class="toolbar" id="toolbar"></div>
  <div class="abar" id="abar"></div>
  <div class="body"><div class="sidebar" id="sidebar"></div><div class="panes" id="panes"></div></div>
  <div class="statusbar"><span id="status"></span><span style="margin-left:auto;display:flex;gap:12px" id="resmon"></span></div>
</div>
<div class="ctx" id="ctx" style="display:none"></div>
<div id="modals"></div>
<div id="rubberband"></div>

<script>
function natCmp(a,b){return a.localeCompare(b,undefined,{numeric:true,sensitivity:'base'})}

let tabs=[],qp={},bm={favourites:[],bookmarks:[]},settings={theme:'light'},sortPrefs={},netLoc={locations:[]},tc=0;
let iconSize='md';
let memory={version:1,favourites:[],bookmarks:[],pinnedFolders:[],cachedFolders:[],recentPaths:[]};
// Renderer-side thumb cache (URL strings). Persists within session. Shared across panes.
let thumbCache={};
let thumbAbort=0;

// ══════════════ SPLIT VIEW — 1 or 2 panes sharing the tab pool ══════════════
// Each pane owns its DOM (.content div + header), its own IntersectionObserver and thumb map,
// and points at one tab. The focused pane is what the toolbar/keyboard/clipboard act on.
let panes=[];          // [{tabId, el, hdrEl, io, imgMap, pending:Set, flushTmr}]
let focusedPaneIdx=0;
let splitOn=false;
function focusedPane(){return panes[focusedPaneIdx]||panes[0]}
function tabOfPane(pane){return pane?tabs.find(t=>t.id===pane.tabId):undefined}
function paneOfEl(el){return panes.find(p=>el&&p.wrap.contains(el))}
function paneIndexOfEl(el){return panes.findIndex(p=>el&&p.wrap.contains(el))}

const ICONS={folder:'📁',txt:'📄',pdf:'📕',doc:'📘',docx:'📘',xls:'📊',xlsx:'📊',csv:'📊',zip:'📦',gz:'📦',tar:'📦','7z':'📦',rar:'📦',deb:'📀',rpm:'📀',appimage:'📀',mp3:'🎵',wav:'🎵',flac:'🎵',ogg:'🎵',aac:'🎵',mp4:'🎬',avi:'🎬',mkv:'🎬',mov:'🎬',webm:'🎬',flv:'🎬',wmv:'🎬',py:'🐍',js:'📜',ts:'📜',html:'🌐',css:'🎨',json:'📋',xml:'📋',md:'📝',sh:'⚙️',conf:'⚙️',log:'📋',default:'📄'};
function ico(e){return e.isDirectory?ICONS.folder:e.isVideo?'🎬':(ICONS[e.ext]||ICONS.default)}
function fmt(b){if(!b)return'—';if(b<1024)return b+' B';if(b<1048576)return(b/1024).toFixed(1)+' KB';if(b<1073741824)return(b/1048576).toFixed(1)+' MB';return(b/1073741824).toFixed(1)+' GB'}
function ct(){return tabOfPane(focusedPane())}
function esc(s){return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
function escAttr(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
function fileCategory(e){if(e.isDirectory)return'📁 Folders';if(e.isImage)return'🖼️ Images';if(e.isVideo)return'🎬 Videos';const d=new Set(['txt','pdf','doc','docx','xls','xlsx','csv','md','json','xml','yaml','yml','html','css']);if(d.has(e.ext))return'📄 Documents';return'📎 Other'}

async function init(){
  qp=await api.quickPaths();
  settings=await api.loadCfg('settings',{theme:'light'});
  bm=await api.loadCfg('bookmarks',{favourites:[],bookmarks:[]});
  sortPrefs=await api.loadCfg('sortprefs',{});
  netLoc=await api.loadCfg('networks',{locations:[]});
  memory=await api.memoryLoad();
  if(!bm.favourites)bm.favourites=[];if(!bm.bookmarks)bm.bookmarks=[];if(!netLoc.locations)netLoc.locations=[];
  if(!memory.cachedFolders)memory.cachedFolders=[];if(!memory.recentPaths)memory.recentPaths=[];

  // Migrate old bookmarks into persistent memory (one-time)
  if(bm.favourites.length&&!memory.favourites?.length){memory.favourites=[...bm.favourites];memory.bookmarks=[...bm.bookmarks];await api.memorySave(memory)}
  // Sync persistent memory back to working bookmarks
  if(memory.favourites?.length&&!bm.favourites.length){bm.favourites=[...memory.favourites];bm.bookmarks=[...(memory.bookmarks||[])];await api.saveCfg('bookmarks',bm)}

  // Try to restore last session
  const session=await api.sessionLoad();
  applyTheme();
  iconSize=settings.iconSize||'md';

  // Create the tab objects to restore
  const restorePaths=(session&&session.tabs&&session.tabs.length)?session.tabs:[qp.home];
  const ids=restorePaths.map(tp=>newTab(tp));

  // Pane 0 (always present)
  const p0tab=ids[(session&&session.panes&&session.panes[0])||0]||ids[0];
  createPane(p0tab);
  setFocus(0);
  await loadPane(0);

  // Restore split (pane 1) if it was on
  if(session&&session.split){
    splitOn=true;
    document.getElementById('panes').classList.add('split');
    let p1tab=(session.panes&&ids[session.panes[1]])||null;
    if(!p1tab||p1tab===p0tab) p1tab=newTab(qp.home);
    createPane(p1tab);
    await loadPane(1);
  }
  renderTabs();renderTB();
}
function applyTheme(){document.body.className=settings.theme==='dark'?'dark':''}

function sessionData(){return {tabs:tabs.map(t=>t.path),split:splitOn,panes:panes.map(p=>tabs.findIndex(t=>t.id===p.tabId))};}
async function saveSession(){try{await api.sessionSave(sessionData());}catch{}}
let _sessTmr=null;
function saveSessionSoon(){clearTimeout(_sessTmr);_sessTmr=setTimeout(saveSession,600);}

async function clearSession(){
  if(!confirm('Clear session history and start fresh?\nAll tabs will close and Home will open.'))return;
  await api.sessionSave(null);
  for(const p of panes){if(p.io)p.io.disconnect();p.wrap.remove();}
  tabs=[];tc=0;panes=[];focusedPaneIdx=0;splitOn=false;
  document.getElementById('panes').classList.remove('split');
  const id=newTab(qp.home);createPane(id);setFocus(0);await loadPane(0);renderTabs();renderTB();
}

// Save session on close
async function doClose(){ await saveSession(); api.winClose(); }

// ═══ TABS + PANES ═══
// newTab creates a tab object (folder + history + per-tab view state) without attaching it to a pane.
function newTab(p){const id=++tc;const t={id,path:p,hist:[p],hi:0,entries:[],filtered:[],sel:new Set(),search:'',scrollPos:{},vm:'grid',sortBy:'name',sortAsc:true,groupBy:'none'};tabs.push(t);loadFolderSort(t);return id}
// addTab creates a tab AND shows it in the focused pane (used by "+", new-tab, etc.)
function addTab(p){const id=newTab(p);assignTabToPane(focusedPaneIdx,id);}
function closeTab(id){
  const minTabs=splitOn?2:1; if(tabs.length<=minTabs)return;
  const i=tabs.findIndex(t=>t.id===id); if(i<0)return;
  tabs.splice(i,1);
  for(let pi=0;pi<panes.length;pi++){
    if(panes[pi].tabId===id){
      const fallback=tabs.find(t=>!panes.some((p,j)=>j!==pi&&p.tabId===t.id))||tabs[0];
      panes[pi].tabId=fallback.id; loadPane(pi);
    }
  }
  renderTabs();
}
// Clicking a tab loads it into the FOCUSED pane.
function switchTab(id){assignTabToPane(focusedPaneIdx,id);}
function renderTabs(){
  const b=document.getElementById('tabbar');
  const fId=focusedPane()?.tabId;
  const oId=splitOn?panes.find((p,i)=>i!==focusedPaneIdx)?.tabId:null;
  const minTabs=splitOn?2:1;
  let h='';
  for(const t of tabs){
    const n=t.path.split('/').filter(Boolean).pop()||'/';
    const cls='tab'+(t.id===fId?' a':'')+(t.id===oId?' other':'');
    h+=`<div class="${cls}" onclick="switchTab(${t.id})" title="${t.path}"><span class="tn">${n}</span>${tabs.length>minTabs?`<span class="tc" onclick="event.stopPropagation();closeTab(${t.id})">✕</span>`:''}</div>`;
  }
  h+=`<button class="tadd" onclick="addTab(ct().path)">+</button>`;
  b.innerHTML=h;
}

// ── Pane management ──
function makePaneEl(){
  const wrap=document.createElement('div');wrap.className='pane';
  const hdr=document.createElement('div');hdr.className='pane-hdr';
  const content=document.createElement('div');content.className='content sz-'+iconSize;
  wrap.appendChild(hdr);wrap.appendChild(content);
  return {wrap,hdr,content};
}
function createPane(tabId){
  const {wrap,hdr,content}=makePaneEl();
  document.getElementById('panes').appendChild(wrap);
  const pane={tabId,el:content,hdrEl:hdr,wrap,io:null,imgMap:new Map(),pending:new Set(),flushTmr:null,flushing:false,flushAgain:false};
  wirePane(pane);
  panes.push(pane);
  return pane;
}
function setFocus(idx){
  if(idx<0||idx>=panes.length)return;
  focusedPaneIdx=idx;
  panes.forEach((p,i)=>p.wrap.classList.toggle('focused',i===focusedPaneIdx));
  renderTabs();renderABar();renderSB();renderTB();updTitle();updStat();
}
function renderPaneHdrs(){for(const p of panes){const t=tabOfPane(p);if(t)p.hdrEl.textContent=t.path;}}

async function assignTabToPane(paneIdx,tabId){

function loadFolderSort(t){const dir=t.path;const p=sortPrefs[dir];if(p){t.sortBy=p.sortBy||'name';t.sortAsc=p.sortAsc!==undefined?p.sortAsc:true;t.groupBy=p.groupBy||'none'}else{const nm=dir.split('/').pop()?.toLowerCase()||'';if(nm==='pictures'||nm==='photos'){t.sortBy='modified';t.sortAsc=false}else if(nm==='downloads'){t.sortBy='modified';t.sortAsc=false}else{t.sortBy='name';t.sortAsc=true}t.groupBy='none'}}
function sortEnt(t){t=t||ct();const sb=t.sortBy,asc=t.sortAsc;t.entries.sort((a,b)=>{if(a.isDirectory!==b.isDirectory)return a.isDirectory?-1:1;let c=0;switch(sb){case'name':c=natCmp(a.name,b.name);break;case'modified':c=a.modifiedMs-b.modifiedMs;break;case'created':c=a.createdMs-b.createdMs;break;case'size':c=a.size-b.size;break;case'type':c=fileCategory(a).localeCompare(fileCategory(b))||natCmp(a.name,b.name);break;case'ext':c=(a.ext||'zzz').localeCompare(b.ext||'zzz')||natCmp(a.name,b.name);break;default:c=natCmp(a.name,b.name)}return asc?c:-c})}

// ═══ NAV (pane-aware) ═══
// nav() operates on the focused pane (keeps the signature used by inline onclick handlers).
function nav(dir,addH=true,saveScroll=true){return navPane(focusedPaneIdx,dir,addH,saveScroll);}
async function navPane(paneIdx,dir,addH=true,saveScroll=true){
  const pane=panes[paneIdx];const t=tabOfPane(pane);if(!t)return;
  // Remember scroll of the folder we're leaving (per-folder, restored on Back).
  if(!t.scrollPos)t.scrollPos={};
  if(saveScroll&&t.path)t.scrollPos[t.path]=pane.el.scrollTop;
  if(addH){
    // Don't push a duplicate of where we already are — that's what made Back "do nothing".
    if(t.hist[t.hi]!==dir){ t.hist=t.hist.slice(0,t.hi+1); t.hist.push(dir); t.hi=t.hist.length-1; }
  }
  t.path=dir;t.sel=new Set();t.search='';t._restoreScroll=true;
  loadFolderSort(t);
  renderTabs();renderPaneHdrs();
  if(paneIdx===focusedPaneIdx){renderABar();renderSB();renderTB();updTitle();}
  await loadDirInto(pane);
  saveSessionSoon(); // keep the session current so any reload restores where we are
}

  t._restoreScroll=true;

}
function loadDir(){return loadDirInto(focusedPane());}
async function loadDirInto(pane){
  const t=tabOfPane(pane);if(!t)return;const el=pane.el;
  el.innerHTML='<div class="loading">Loading...</div>';
  thumbAbort++;
  await api.cancelThumbBatch(); // Kill any running batch immediately

  const r=await api.readdirPaged(t.path, 0, 500);
  if(!r.ok){el.innerHTML=`<div class="empty"><div class="big">⚠️</div><div>${r.error}</div></div>`;return}

  t.entries=r.entries;

  if(r.hasMore){
    let offset=500;
    const loadMore=async()=>{
      const r2=await api.readdirPaged(t.path, offset, 500);
      if(r2.ok&&r2.entries.length){
        t.entries=t.entries.concat(r2.entries);
        offset+=500;
        if(r2.hasMore) setTimeout(loadMore, 50);
        else { sortEnt(t); filterEnt(pane); }
      }
    };
    sortEnt(t); filterEnt(pane);
    setTimeout(loadMore, 100);
  } else {
    sortEnt(t); filterEnt(pane);
  }

  if(memory.cachedFolders&&memory.cachedFolders.includes(t.path)){
    api.memorySyncFolder(t.path);
  }
}

// ═══ BUILD CONTENT — builds DOM once, then thumbs load into existing elements ═══
function buildContent(pane){
  pane=pane||focusedPane();const t=tabOfPane(pane),el=pane.el;if(!t)return;
  const isFocused=(pane===focusedPane());
  if(!t.filtered.length){el.innerHTML='<div class="empty"><div class="big">📂</div><div>This folder is empty</div></div>';pane.imgMap=new Map();if(isFocused)updStat();return}

  // Group
  let groups;
  if(t.groupBy==='type'){groups={};for(const e of t.filtered){const c=fileCategory(e);if(!groups[c])groups[c]=[];groups[c].push(e)}}
  else if(t.groupBy==='date'){groups={};for(const e of t.filtered){const d=e.modified||'Unknown';if(!groups[d])groups[d]=[];groups[d].push(e)}}
  else groups={'':t.filtered};

  let html='';
  for(const[gn,items]of Object.entries(groups)){
    if(gn)html+=`<div class="group-hdr">${gn}</div>`;
    if(t.vm==='list'){
      const ar=col=>t.sortBy===col?(t.sortAsc?'▲':'▼'):'';
      html+=`<div class="lh"><span class="${t.sortBy==='name'?'sorted':''}" onclick="setSortCol('name')">Name ${ar('name')}</span><span class="${t.sortBy==='size'?'sorted':''}" onclick="setSortCol('size')">Size ${ar('size')}</span><span class="${t.sortBy==='type'?'sorted':''}" onclick="setSortCol('type')">Type ${ar('type')}</span><span class="${t.sortBy==='modified'?'sorted':''}" onclick="setSortCol('modified')">Modified ${ar('modified')}</span></div>`;
    }
    const isGrid=t.vm==='grid',isTile=t.vm==='tiles';
    if(isGrid)html+='<div class="gv">';
    if(isTile)html+='<div class="tv">';
    for(const e of items){
      const p=esc(e.path),sel=t.sel.has(e.name)?'sel':'';
      // data-path / data-isdir drive the mouse-emulated internal drag (see drag section).
      const data=`data-name="${escAttr(e.name)}" data-path="${escAttr(e.path)}" data-isdir="${e.isDirectory?1:0}"`;
      // External drops (from Nemo/desktop) onto a folder tile still use HTML5 DnD.
      const dropAttr=e.isDirectory?`ondragover="dov(event)" ondragleave="dlv(event)" ondrop="drp(event,'${p}')"`:''
      const click=`onclick="event.stopPropagation();sel(event,'${esc(e.name)}')" ondblclick="openItem('${p}',${e.isDirectory},${e.isImage})" oncontextmenu="showCtx(event,'${p}',${e.isDirectory},${e.isImage},${e.isVideo||false})"`;
      const hasThumb=e.isImage||e.isVideo;
      const cachedUrl=hasThumb?thumbCache[e.path]:null;
      // NOTE: no loading="lazy" — we lazy-load via IntersectionObserver already, and lazy + the
      // localthumb:// protocol + content-visibility caused the browser to never fetch the thumb.
      const imgTag=hasThumb?`<img data-fpath="${escAttr(e.path)}" decoding="async" src="${cachedUrl||''}">`:`<span class="fi">${ico(e)}</span>`;

      if(isGrid){
        html+=`<div class="gi ${sel}" ${data} ${click} ${dropAttr}><div class="th">${imgTag}${e.isVideo?'<span class="vbadge">▶</span>':''}</div><div class="fn">${e.name}</div></div>`;
      } else if(isTile){
        html+=`<div class="ti ${sel}" ${data} ${click} ${dropAttr}><div class="th">${imgTag}</div><div class="tinfo"><div class="tname">${e.name}</div><div class="tmeta">${e.isDirectory?'Folder':fmt(e.size)}</div><div class="tdate">${e.modified}</div></div></div>`;
      } else {
        const tp=e.isDirectory?'Folder':e.isVideo?'Video':e.ext?(e.ext.toUpperCase()+' File'):'File';
        html+=`<div class="li ${sel}" ${data} ${click} ${dropAttr}><div class="ln">${imgTag}<span>${e.name}</span></div><span class="lm">${e.isDirectory?'':fmt(e.size)}</span><span class="lm">${tp}</span><span class="lm">${e.modified}</span></div>`;
      }
    }
    if(isGrid)html+='</div>';
    if(isTile)html+='</div>';
  }
  const prevScroll=el.scrollTop;
  el.innerHTML=html;
  // Build this pane's direct element reference map (no CSS selector ever used for thumb assignment)
  pane.imgMap=new Map();
  el.querySelectorAll('img[data-fpath]').forEach(imgEl=>{
    const fpath=imgEl.getAttribute('data-fpath');
    if(fpath) pane.imgMap.set(fpath,imgEl);
  });
  if(isFocused)updStat();
  // Restore the saved scroll position only on a fresh navigation; during background
  // "load more" re-renders keep wherever the user has scrolled to.
  if(t._restoreScroll){ el.scrollTop=(t.scrollPos&&t.scrollPos[t.path])||0; t._restoreScroll=false; }
  else el.scrollTop=prevScroll;
  observeThumbs(pane);
}

// ═══ THUMBNAIL PIPELINE — IntersectionObserver driven ═══
// Only items that actually scroll near the viewport request a thumbnail. This replaces
// the old scroll-listener + getBoundingClientRect scan (which thrashed layout on every scroll).
let debugLines=[];
function dbg(obj){debugLines.push({...obj,ts:Date.now()});if(debugLines.length>500)debugLines.shift()}

// Each pane has its own IntersectionObserver + pending set + image map (thumbCache is shared).
function observeThumbs(pane){
  if(pane.io) pane.io.disconnect();
  pane.pending.clear(); clearTimeout(pane.flushTmr);
  pane.io=new IntersectionObserver(entries=>{
    for(const en of entries){
      if(!en.isIntersecting) continue;
      const img=en.target, fp=img.getAttribute('data-fpath');
      pane.io.unobserve(img); // request a given thumb only once
      if(fp && !thumbCache[fp]) pane.pending.add(fp);
      else if(fp && thumbCache[fp]) img.src=thumbCache[fp];
    }
    clearTimeout(pane.flushTmr); pane.flushTmr=setTimeout(()=>flushThumbs(pane), 80);
  },{root:pane.el, rootMargin:'400px 0px'}); // start loading ~400px before they enter view

  // Apply already-cached thumbs instantly; observe the rest.
  for(const[fp,img]of pane.imgMap){
    if(thumbCache[fp]) img.src=thumbCache[fp];
    else pane.io.observe(img);
  }
}

// Serialized per pane: if a flush is already running, just mark "run again" and let the
// running one pick up the newly-queued paths. Concurrent flushes used to call newBatchId per
// chunk and mutually abort each other in the main process — which is why large folders
// (and slow video chunks) showed no thumbnails.
async function flushThumbs(pane){
  if(pane.flushing){ pane.flushAgain=true; return; }
  pane.flushing=true;
  try{
    do{
      pane.flushAgain=false;
      if(!pane.pending.size) continue;
      const paths=[...pane.pending]; pane.pending.clear();

      // Cheap pass: whatever the main process already has cached in memory.
      let mainCached={};
      try{ mainCached=await api.getCachedThumbs(paths); }catch{}
      const need=[];
      for(const p of paths){
        const url=mainCached[p];
        if(url){ thumbCache[p]=url; const el=pane.imgMap.get(p); if(el)el.src=url; }
        else need.push(p);
      }
      // Generate the rest in chunks of 30 (main caps concurrency + memory internally).
      for(let i=0;i<need.length;i+=30){
        const chunk=need.slice(i,i+30);
        let results=null;
        try{ results=await api.generateThumbBatch(chunk, 0); }catch{} // no per-chunk batch id → no abort churn
        if(!results) continue;
        for(const[p,url]of Object.entries(results)){
          if(url){ thumbCache[p]=url; const el=pane.imgMap.get(p); if(el)el.src=url; dbg({event:'thumb_assign_ok',path:p}); }
        }
      }
    } while(pane.flushAgain || pane.pending.size);
  } finally { pane.flushing=false; }
}

// ═══ SELECTION — toggle CSS class, NO re-render (operates on the focused pane) ═══
function sel(ev,name){
  const pane=focusedPane(),t=tabOfPane(pane);if(!t)return;
  const idx=t.filtered.findIndex(e=>e.name===name);
  if(ev.ctrlKey){t.sel.has(name)?t.sel.delete(name):t.sel.add(name); t.cursor=idx; t.anchor=idx;}
  else if(ev.shiftKey){const names=t.filtered.map(e=>e.name),last=[...t.sel].pop();if(last){const a=names.indexOf(last),b=names.indexOf(name),[lo,hi]=a<b?[a,b]:[b,a];for(let i=lo;i<=hi;i++)t.sel.add(names[i])}else t.sel.add(name); t.cursor=idx;}
  else { t.sel=new Set([name]); t.cursor=idx; t.anchor=idx; }
  syncSelectionCSS(pane);
}

// Arrow-key navigation (Windows Explorer): move a selection cursor through the grid/list.
function gridCols(pane){
  const items=pane.el.querySelectorAll('.gi'); if(items.length<2)return 1;
  const top=items[0].offsetTop; let c=0;
  for(const it of items){ if(it.offsetTop===top)c++; else break; }
  return Math.max(1,c);
}
function moveCursor(dir,extend){
  const pane=focusedPane(),t=tabOfPane(pane); if(!t||!t.filtered.length)return;
  let cur=(t.cursor!=null&&t.cursor<t.filtered.length)?t.cursor:t.filtered.findIndex(e=>t.sel.has(e.name));
  if(cur<0)cur=0;
  const cols=(t.vm==='list')?1:gridCols(pane);
  let ni=cur;
  if(dir==='left')ni=cur-1; else if(dir==='right')ni=cur+1;
  else if(dir==='up')ni=cur-cols; else if(dir==='down')ni=cur+cols;
  else if(dir==='home')ni=0; else if(dir==='end')ni=t.filtered.length-1;
  ni=Math.max(0,Math.min(t.filtered.length-1,ni));
  t.cursor=ni;
  if(extend){ const a=(t.anchor!=null)?t.anchor:cur; const lo=Math.min(a,ni),hi=Math.max(a,ni); t.sel=new Set(t.filtered.slice(lo,hi+1).map(e=>e.name)); }
  else { t.sel=new Set([t.filtered[ni].name]); t.anchor=ni; }
  syncSelectionCSS(pane);
  let el=null; pane.el.querySelectorAll('.gi,.li,.ti').forEach(x=>{ if(!el&&x.getAttribute('data-name')===t.filtered[ni].name)el=x; });

function startRename(name){
  const t=ct(); const e=t&&t.entries.find(x=>x.name===name); if(!e)return;
  const pane=focusedPane(); let tile=null; pane.el.querySelectorAll('.gi,.li,.ti').forEach(x=>{ if(!tile&&x.getAttribute('data-name')===name)tile=x; });
  if(!tile){ const nn=prompt('Rename to:',name); if(nn&&nn!==name)api.smartRename(e.path,nn).then(r=>{ if(r&&r.ok)loadDir(); else if(r&&r.error)alert('Rename failed: '+r.error); }); return; }
  const label=tile.querySelector('.fn,.tname,.ln span'); if(!label)return;
  const inp=document.createElement('input'); inp.className='rename-input'; inp.value=name; inp.spellcheck=false;
  label.replaceWith(inp); inp.focus();
  const dot=name.lastIndexOf('.'); try{ inp.setSelectionRange(0, dot>0?dot:name.length); }catch{}
  let done=false;
  const commit=async(save)=>{ if(done)return; done=true; const nn=inp.value.trim();
    if(save&&nn&&nn!==name){ const r=await api.smartRename(e.path,nn); if(r&&r.error)alert('Rename failed: '+r.error); }
    await loadDir();
  };
  inp.addEventListener('keydown',ev=>{ ev.stopPropagation(); if(ev.key==='Enter'){ ev.preventDefault(); commit(true); } else if(ev.key==='Escape'){ ev.preventDefault(); commit(false); } });
  inp.addEventListener('blur',()=>commit(true));

}

async function pasteHere(){
  const clip=await api.clipGet();
  if(!clip||!clip.paths||!clip.paths.length)return;
  const successPaths=[];
  for(const p of clip.paths){
    const r=await api.smartCopy(p,ct().path);
    if(r&&r.ok&&r.action!=='skipped') successPaths.push(p);
    else if(!r||!r.ok) alert('Failed to paste: '+p.split('/').pop()+'\n'+(r?.error||'Unknown error'));

// ═══ DRAG & DROP (pane-aware) ═══
// Resolve a dropped File to an absolute path (E28: File.path; future-proofed via preload).
function droppedPath(f){ try{ return api.pathForFile(f); }catch{ return f&&f.path; } }

// EXTERNAL drops (from Nemo, desktop, other apps) onto a folder tile — real HTML5 drag events.
function dov(ev){ev.preventDefault();ev.dataTransfer.dropEffect='copy';ev.currentTarget.classList.add('dov')}
function dlv(ev){ev.currentTarget.classList.remove('dov')}
async function drp(ev,dest){ev.preventDefault();ev.stopPropagation();ev.currentTarget.classList.remove('dov');const pane=paneOfEl(ev.currentTarget);const files=ev.dataTransfer.files;if(files&&files.length){for(const f of files){const fp=droppedPath(f);if(fp)await api.smartCopy(fp,dest)}if(pane)await loadDirInto(pane);}}
// GLOBAL GUARD: dropping a file on the toolbar/sidebar/titlebar would navigate to file:// and blank
// the window. Block the default everywhere; real drop targets are wired per-pane in wirePane().
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',e=>e.preventDefault());

// ── Focus follows mouse into a pane (capture phase → runs before tile onclick/ondblclick) ──
document.getElementById('panes').addEventListener('mousedown',e=>{
  const idx=paneIndexOfEl(e.target);
  if(idx>=0&&idx!==focusedPaneIdx)setFocus(idx);
},true);

// ── INTERNAL DRAG (mouse-emulated): move/copy within a pane AND across panes; drag-out on exit ──
let dragState=null, dragJustHappened=false;
const DRAG_THRESHOLD=6;
const rbEl=document.getElementById('rubberband');
let rbState=null;
function clearDropHi(){document.querySelectorAll('.gi.dov,.li.dov,.ti.dov').forEach(x=>x.classList.remove('dov'))}

// Per-pane wiring: external drop, drag/rubber-band start, click (clear selection / swallow post-drag).
function wirePane(pane){
  const el=pane.el;
  el.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='copy'});
  el.addEventListener('drop',async e=>{e.preventDefault();const t=tabOfPane(pane);const files=e.dataTransfer.files;if(files&&files.length&&t){for(const f of files){const fp=droppedPath(f);if(fp)await api.smartCopy(fp,t.path)}await loadDirInto(pane);}});
  el.addEventListener('mousedown',e=>{
    if(e.button!==0)return;
    const tile=e.target.closest('.gi,.li,.ti');
    if(tile){
      dragState={srcPath:tile.getAttribute('data-path'),srcName:tile.getAttribute('data-name'),srcPaneIdx:panes.indexOf(pane),startX:e.clientX,startY:e.clientY,active:false,dropTile:null};
    } else if(!e.target.closest('.lh,.group-hdr')){
      rbState={paneIdx:panes.indexOf(pane),sx:e.clientX,sy:e.clientY};
      rbEl.style.left=e.clientX+'px';rbEl.style.top=e.clientY+'px';rbEl.style.width='0';rbEl.style.height='0';rbEl.style.display='block';
    }
  });
  el.addEventListener('click',e=>{
    if(dragJustHappened){e.stopPropagation();e.preventDefault();return;}
    if(!e.target.closest('.gi,.li,.ti')){const t=tabOfPane(pane);if(t){t.sel=new Set();syncSelectionCSS(pane);}hideCtx();}
  },true);
}

document.addEventListener('mousemove',e=>{
  // Internal drag highlight
  if(dragState){
    if(!dragState.active){
      if(Math.abs(e.clientX-dragState.startX)<DRAG_THRESHOLD&&Math.abs(e.clientY-dragState.startY)<DRAG_THRESHOLD){/* not yet */}
      else {dragState.active=true;document.body.style.cursor='copy';}
    }
    if(dragState.active){
      const el=document.elementFromPoint(e.clientX,e.clientY);
      const tile=el&&el.closest('.gi,.li,.ti');
      clearDropHi();
      if(tile&&tile.getAttribute('data-isdir')==='1'&&tile.getAttribute('data-path')!==dragState.srcPath){tile.classList.add('dov');dragState.dropTile=tile;}
      else dragState.dropTile=null;
    }
  }
  // Rubber-band (scoped to the pane it started in)
  if(rbState){
    const x=Math.min(rbState.sx,e.clientX),y=Math.min(rbState.sy,e.clientY),w=Math.abs(e.clientX-rbState.sx),h=Math.abs(e.clientY-rbState.sy);
    rbEl.style.left=x+'px';rbEl.style.top=y+'px';rbEl.style.width=w+'px';rbEl.style.height=h+'px';
    const rect={left:x,top:y,right:x+w,bottom:y+h};
    const pane=panes[rbState.paneIdx],t=tabOfPane(pane);if(!t)return;t.sel=new Set();
    pane.el.querySelectorAll('.gi,.li,.ti').forEach(el=>{
      const r=el.getBoundingClientRect();
      if(r.left<rect.right&&r.right>rect.left&&r.top<rect.bottom&&r.bottom>rect.top){const nm=el.getAttribute('data-name');if(nm)t.sel.add(nm);el.classList.add('sel');}
      else el.classList.remove('sel');
    });
    updStat();
  }
});

document.addEventListener('mouseup',async e=>{
  if(rbState){rbState=null;rbEl.style.display='none';}
  if(!dragState)return;
  const st=dragState;dragState=null;document.body.style.cursor='';clearDropHi();
  if(!st.active)return; // a click, not a drag — let selection handle it
  dragJustHappened=true;setTimeout(()=>dragJustHappened=false,0);
  // Destination: a folder tile under the cursor, else the pane under the cursor (its current folder).
  let dest=null,destPaneIdx=-1;
  if(st.dropTile){dest=st.dropTile.getAttribute('data-path');}
  else{const idx=paneIndexOfEl(document.elementFromPoint(e.clientX,e.clientY));if(idx>=0){destPaneIdx=idx;const dt=tabOfPane(panes[idx]);if(dt)dest=dt.path;}}
  if(!dest)return;
  const srcTab=tabOfPane(panes[st.srcPaneIdx]);
  // Dropped in the empty space of the same folder the files already live in → nothing to do.
  if(!st.dropTile&&srcTab&&dest===srcTab.path)return;
  let paths=srcTab&&srcTab.sel.has(st.srcName)?[...srcTab.sel].map(n=>srcTab.entries.find(x=>x.name===n)?.path).filter(Boolean):[st.srcPath];
  paths=paths.filter(p=>p&&p!==dest);
  if(!paths.length)return;
  const move=!e.ctrlKey; // default = move; hold Ctrl = copy
  for(const p of paths){const r=await api.smartCopy(p,dest);if(move&&r&&r.ok&&r.action!=='skipped')await api.trash(p);}
  if(panes[st.srcPaneIdx])await loadDirInto(panes[st.srcPaneIdx]);                       // source files moved out
  if(destPaneIdx>=0&&destPaneIdx!==st.srcPaneIdx)await loadDirInto(panes[destPaneIdx]);  // empty-area drop target
});
// Pointer left the window during a drag → hand off to a native OS drag (drag-out to other apps).
window.addEventListener('mouseout',e=>{
  if(dragState&&dragState.active&&(e.relatedTarget===null||e.relatedTarget.nodeName==='HTML')){
    const src=dragState.srcPath;dragState=null;document.body.style.cursor='';clearDropHi();
    api.nativeDrag(src);
  }
});

  if(e.ctrlKey&&(e.key==='l'||e.key==='L')){e.preventDefault();editAddress();return;}
  if(e.altKey&&(e.key==='d'||e.key==='D')){e.preventDefault();editAddress();return;}
  if(e.ctrlKey&&(e.key==='f'||e.key==='F')){e.preventDefault();const s=document.getElementById('searchBox');if(s){s.focus();s.select();}return;}
  if(inEditable)return; // an input has focus — let it handle keys
  if(e.key==='Backspace'||(e.altKey&&e.key==='ArrowLeft')){e.preventDefault();goBack();return;}
  if(e.altKey&&e.key==='ArrowRight'){e.preventDefault();goFwd();return;}
  if(e.altKey&&e.key==='ArrowUp'){e.preventDefault();goUp();return;}
  if(e.key==='Delete'&&e.shiftKey){e.preventDefault();permDeleteSel();return;}
  if(e.key==='Delete'){deleteSel();return;}
  if(e.key==='F2'){renameSel();return;}
  if(e.key==='F5'){loadDir();return;}
  if(e.ctrlKey&&e.shiftKey&&(e.key==='N'||e.key==='n')){e.preventDefault();newFolder();return;}
  if(e.ctrlKey&&(e.key==='c'||e.key==='C')){e.preventDefault();copySel();return;}
  if(e.ctrlKey&&(e.key==='x'||e.key==='X')){e.preventDefault();cutSel();return;}
  if(e.ctrlKey&&(e.key==='v'||e.key==='V')){e.preventDefault();pasteHere();return;}
  if(e.ctrlKey&&(e.key==='t'||e.key==='T')){e.preventDefault();addTab(ct().path);return;}
  if(e.ctrlKey&&(e.key==='w'||e.key==='W')){e.preventDefault();closeTab(focusedPane()?.tabId);return;}
  if(e.ctrlKey&&(e.key==='a'||e.key==='A')){e.preventDefault();ct().sel=new Set(ct().filtered.map(x=>x.name));syncSelectionCSS();return;}
  if(e.key==='F6'){e.preventDefault();if(panes.length>1)setFocus((focusedPaneIdx+1)%panes.length);return;}
  if(e.key==='F12'){e.preventDefault();showDebugLog();return;}
  // Arrow-key navigation + Enter to open (Windows Explorer behaviour)
  if(!e.altKey&&!e.ctrlKey){
    if(e.key==='ArrowLeft'){e.preventDefault();moveCursor('left',e.shiftKey);return;}
    if(e.key==='ArrowRight'){e.preventDefault();moveCursor('right',e.shiftKey);return;}
    if(e.key==='ArrowUp'){e.preventDefault();moveCursor('up',e.shiftKey);return;}
    if(e.key==='ArrowDown'){e.preventDefault();moveCursor('down',e.shiftKey);return;}
    if(e.key==='Home'){e.preventDefault();e.shiftKey?selAbove():moveCursor('home',false);return;}
    if(e.key==='End'){e.preventDefault();e.shiftKey?selBelow():moveCursor('end',false);return;}
    if(e.key==='Enter'){e.preventDefault();openCursor();return;}
  }
  // Type-ahead: typing letters jumps to the first matching file
  if(!e.ctrlKey&&!e.altKey&&!e.metaKey&&e.key&&e.key.length===1){ typeAhead(e.key); }
});
let taBuf='', taTmr=null;
function typeAhead(ch){
  clearTimeout(taTmr); taBuf+=ch.toLowerCase(); taTmr=setTimeout(()=>{taBuf='';},900);
  const t=ct(); if(!t||!t.filtered.length) return;
  let match=t.filtered.find(e=>e.name.toLowerCase().startsWith(taBuf));
  if(!match&&taBuf.length>1){ taBuf=ch.toLowerCase(); match=t.filtered.find(e=>e.name.toLowerCase().startsWith(taBuf)); } // restart on the new letter
  if(!match) return;
  t.sel=new Set([match.name]);
  const pane=focusedPane(); syncSelectionCSS(pane);
  let el=null; pane.el.querySelectorAll('.gi,.li,.ti').forEach(x=>{ if(!el&&x.getAttribute('data-name')===match.name) el=x; });
  if(el) el.scrollIntoView({block:'nearest'});
}

function showDebugLog(){
  const last50=debugLines.slice(-50).map(d=>JSON.stringify(d)).join('\n');
  document.getElementById('modals').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)clsMod()"><div class="modal" style="width:600px;max-height:80vh;overflow:auto"><h3>🐛 Thumbnail Debug Log (last 50)</h3><pre style="font-size:11px;color:var(--t2);white-space:pre-wrap;max-height:50vh;overflow:auto;background:var(--hv);padding:8px;border-radius:4px">${last50||'No events logged yet'}</pre><div class="mbtns"><button class="mbtn s" onclick="clearThumbCache()">🗑️ Clear Thumb Cache</button><button class="mbtn s" onclick="clsMod()">Close</button></div></div></div>`;
}

async function clearThumbCache(){
  thumbCache={};
  dbg({event:'cache_cleared',source:'user'});
  clsMod();
  await loadDir(); // reload current folder
}

init();
